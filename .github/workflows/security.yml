name: Check secrets and private information
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/setup_security.py --no-hooks
      - run: python scripts/security_check.py --mode worktree
      - run: python scripts/security_check.py --mode history
